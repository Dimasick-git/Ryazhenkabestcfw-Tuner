[Приложения]
;mode=table
;spacing=8
;gap=22
'Форматы' = 'NRO и ZIP'
'Источник' = 'последний GitHub Release'
'Установка' = 'удерживайте A'

[Установить RyazhaAI]
;hold=true
try:
mkdir /switch/ryazha-ai
download https://github.com/Dimasick-git/RyazhaAI/releases/latest/download/ryazha-ai.nro /switch/ryazha-ai/ryazha-ai.nro
set-footer Установлено
notify-now 'RyazhaAI установлен в Homebrew Menu.'

[Установить RyazhaTune — медиаплеер]
;hold=true
try:
mkdir ./downloads
download https://github.com/Dimasick-git/RyazhaTune/releases/latest/download/RyazhTune.zip ./downloads/RyazhaTune.zip
unzip ./downloads/RyazhaTune.zip /
delete ./downloads/RyazhaTune.zip
set-footer Установлено
notify-now 'RyazhaTune установлен. Перезагрузите Switch.'

[Установить SwitchWave]
;hold=true
try:
mkdir ./downloads
download https://github.com/Dimasick-git/SwitchWave/releases/latest/download/SwitchWave.zip ./downloads/SwitchWave.zip
