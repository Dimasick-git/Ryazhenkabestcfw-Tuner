[Базовые компоненты]
;mode=table
;spacing=8
;gap=22
'Источник' = 'последний GitHub Release'
'URL' = 'releases/latest/download'
'Установка' = 'удерживайте A'

[Установить Ryazhahand Overlay]
;hold=true
try:
mkdir ./downloads
download https://github.com/Dimasick-git/Ryazhahand-Overlay/releases/latest/download/sdout.zip ./downloads/Ryazhahand-sdout.zip
unzip ./downloads/Ryazhahand-sdout.zip /
delete ./downloads/Ryazhahand-sdout.zip
set-footer Установлено
notify-now 'Ryazhahand установлен. Перезагрузите Switch.'

