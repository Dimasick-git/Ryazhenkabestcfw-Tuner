[Overlays]
;mode=table
;spacing=8
;gap=22
'Форматы' = 'ZIP и OVL'
'Источник' = 'последний GitHub Release'
'Установка' = 'удерживайте A'

[Установить ovlSysmodules]
;hold=true
try:
mkdir ./downloads/ovlSysmodules
download https://github.com/Dimasick-git/ovlSysmodules/releases/latest/download/ovlSysmodules.zip ./downloads/ovlSysmodules.zip
unzip ./downloads/ovlSysmodules.zip ./downloads/ovlSysmodules/
copy ./downloads/ovlSysmodules/switch/ /switch/
copy ./downloads/ovlSysmodules/config/ /config/
delete ./downloads/ovlSysmodules.zip
delete ./downloads/ovlSysmodules
set-footer Установлено
notify-now 'ovlSysmodules установлен.'

