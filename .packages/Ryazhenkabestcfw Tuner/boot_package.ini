[boot]
; Ryazhenkabestcfw Tuner v11.0.0
; Тюнинг и лимит тока находятся в Ryazha-clk.
; Миграционная очистка запускается при открытии пакета после перезагрузки.
; Команды идемпотентны: после первой очистки они больше ничего не удаляют.

; Полное удаление старого Ultra Tuner и его конфигураций.
file_source '/switch/.packages/Ultra Tuner/*'
del {file_source}
del '/switch/.packages/Ultra Tuner/'
file_source '/switch/.packages/Ultra-Tuner/*'
del {file_source}
del '/switch/.packages/Ultra-Tuner/'
file_source /config/UltraNX/*
del {file_source}
del /config/UltraNX/
file_source /config/Ultra/*
del {file_source}
del /config/Ultra/
file_source /UltraCam/*
del {file_source}
del /UltraCam/
del /atmosphere/kips/loader.kip

; Устаревшие sysmodule и загрузочные остатки, которые были в v7.2.1,
; но отсутствуют в актуальной Ряженке v8.0.0. Удаляются только точные старые пути.
; 0100000000000880 — старый компонент подсветки.
; 4200000000000000 — старый RyazhTune/sys-tune; актуальный RyazhTune использует 420000000000000E.
del '/atmosphere/contents/0100000000000880/'
del '/atmosphere/contents/4200000000000000/'

; Старые оверлеи и конфиги sys-clk/sys-tune. Актуальные Ryazha-clk,
; RyazhTune-Overlay и их папки config/ryazha-clk и config/RyazhTune не затрагиваются.
del '/switch/.overlays/sys-clk-overlay.ovl'
del '/switch/.overlays/RyazhTune-overlay.ovl'
file_source '/config/sys-clk/*'
del {file_source}
del '/config/sys-clk/'
file_source '/config/sys-tune/*'
del {file_source}
del '/config/sys-tune/'

; Внешние настройки тюнинга из прежних выпусков Ряженки.
file_source /config/RyazhenkaTop/*
del {file_source}
del /config/RyazhenkaTop/
file_source /config/ryazhenka/*
del {file_source}
del /config/ryazhenka/
file_source '/config/РяженкаNX/*'
del {file_source}
del '/config/РяженкаNX/'
del /config/curves.ini
del /config/preset.ini

; Файлы тюнингового ядра v10.6, которые могут остаться при распаковке v11 поверх старой папки.
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/AtmosPatches/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/AtmosPatches/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Fans/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Fans/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Presets/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Presets/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Memory Kit/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Memory Kit/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/RyazhaClk/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/RyazhaClk/'
file_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/Ultra/*'
del {file_source}
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/Ultra/'

; Отдельные служебные файлы старого Data/Updater.
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/boot_package.ini'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/config.ini'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/delete.json'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/exosphere_8GB.bin'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/monitor preset.json'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/payload_8GB.bin'
del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/ram.json'

; 4IFIR / Chefir: точный пакет Wizard из официального update-архива.
file_source '/switch/.packages/4IFIR Wizard/*'
del {file_source}
del '/switch/.packages/4IFIR Wizard/'
del '/switch/.packages/files.zip'

; NX-Venom: только собственные пакеты тюнера. Общий Alchemist сохраняется.
file_source '/switch/.packages/Easy Setup/*'
del {file_source}
del '/switch/.packages/Easy Setup/'
file_source '/switch/.packages/Ez/*'
del {file_source}
del '/switch/.packages/Ez/'
file_source '/switch/.packages/Lightning/*'
del {file_source}
del '/switch/.packages/Lightning/'
file_source '/switch/.packages/Memory Kit/*'
del {file_source}
del '/switch/.packages/Memory Kit/'
file_source '/switch/.packages/RAM Patch/*'
del {file_source}
del '/switch/.packages/RAM Patch/'
