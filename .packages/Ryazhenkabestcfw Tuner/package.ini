[@Моды]

[Header]
;mode=table
;background=false
;gap=17
'UltraCam для Zelda' = ''

[*Zelda: Слёзы королевства]
;mode=forwarder
;mini=true
package_source './Data/Updater/UltraCam/TotK.ini'
cp './Data/Updater/UltraCam/TotK Init.ini' './Data/Updater/UltraCam/TotK.ini'
cp '/config/Ryazhenka/Mods/TotK.ini' './Data/Updater/UltraCam/TotK.ini'
exec TotK './Data/Updater/UltraCam/boot_package.ini'

[*Zelda: Дыхание природы]
;mode=forwarder
;mini=true
package_source './Data/Updater/UltraCam/BotW.ini'
cp './Data/Updater/UltraCam/BotW Init.ini' './Data/Updater/UltraCam/BotW.ini'
cp '/config/Ryazhenka/Mods/BotW.ini' './Data/Updater/UltraCam/BotW.ini'
exec BotW './Data/Updater/UltraCam/boot_package.ini'

[*Zelda: Эхо мудрости]
