[Принудительные 8 ГБ ОЗУ]
;system=mariko
;mode=toggle
;mini=true
on:
   mkdir /config/Ryazhenka/8GB/
   mv /payload.bin /config/Ryazhenka/8GB/payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/8GB/payload 8GB.bin' /payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/8GB/payload 8GB.bin' /atmosphere/reboot_payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/8GB/payload 8GB.bin' /bootloader/update.bin
   set-ini-val ./config.ini '8GB Patch' value On
off:
   cp /config/Ryazhenka/8GB/payload.bin /payload.bin
   cp /config/Ryazhenka/8GB/payload.bin /bootloader/update.bin
   mv /config/Ryazhenka/8GB/payload.bin /atmosphere/reboot_payload.bin
   set-ini-val ./config.ini '8GB Patch' value Off

