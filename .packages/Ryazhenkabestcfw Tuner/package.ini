[@Другое]

[Info]
;mode=table
;background=false
;gap=25
'Atmosphere'='Перезагрузка для примен.'

[Планировщик GPU]
;mode=toggle
;mini=true
on:
   set-ini-val /atmosphere/config/system_settings.ini am.gpu gpu_scheduling_enabled u8!0x1
off:
   set-ini-val /atmosphere/config/system_settings.ini am.gpu gpu_scheduling_enabled u8!0x0

[USB 3.0]
;mode=toggle
;mini=true
on:
   set-ini-val /atmosphere/config/system_settings.ini usb usb30_force_enabled u8!0x1
off:
   set-ini-val /atmosphere/config/system_settings.ini usb usb30_force_enabled u8!0x0

[Авто перезагр.]
;mode=toggle
;mini=true
on:
   set-ini-val /atmosphere/config/system_settings.ini atmosphere fatal_auto_reboot_interval u64!0x3000
off:
   set-ini-val /atmosphere/config/system_settings.ini atmosphere fatal_auto_reboot_interval u64!0x0

[Gap]
;mode=table
;background=false
;gap=18

[Info]
;mode=table
;background=false
;gap=20
'Видео'=''

[Кадры]
;mode=named_step_trackbar
;unlocked=false
json_source '[{"name":"30 FPS", "value":"u32!30"}, {"name":"60 FPS", "value":"u32!60"}]' name
set-ini-val /atmosphere/config/system_settings.ini am.debug continuous_recording_fps {json_source(*,value)}

[Битрейт]
;mode=named_step_trackbar
;unlocked=false
json_source '[{"name":"5.9 Мб [30с]", "value":"u32!0x5A06E0"}, {"name":"9.2 Мб [20с]", "value":"u32!0x8C6180"}, {"name":"13 Мб [15с]", "value":"u32!0xC65D40"}, {"name":"20 Мб [10с]", "value":"u32!0x1312D00"}]' name
set-ini-val /atmosphere/config/system_settings.ini am.debug continuous_recording_video_bit_rate {json_source(*,value)}

[Gap]
;mode=table
;background=false
;gap=25

[Header]
;mode=table
;background=false
;header_indent=true
;gap=20
'Память и патчи' = ''

[Обновить Memory Kit]
;mode=action
;mini=true
try:
   mkdir /config/ryazhahand/downloads/Ryazhenka/MemoryKit/
   download 'https://github.com/ppkantorski/Memory-Kit/releases/latest/download/Memory.Kit.zip' /config/ryazhahand/downloads/Ryazhenka/MemoryKit/Memory.Kit.zip
   unzip /config/ryazhahand/downloads/Ryazhenka/MemoryKit/Memory.Kit.zip /config/ryazhahand/downloads/Ryazhenka/MemoryKit/
   del '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Memory Kit/'
   mv '/config/ryazhahand/downloads/Ryazhenka/MemoryKit/switch/.packages/Memory Kit/' '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Memory Kit/'
   del /config/ryazhahand/downloads/Ryazhenka/
   echo "Memory Kit обновлён внутри тюнера!"
except:
   echo "Ошибка обновления Memory Kit"
end

[*Memory Kit]
;mode=forwarder
;mini=true
package_source './Data/Memory Kit/package.ini'

[Принудительные 8 ГБ RAM]
;system=mariko
;mode=toggle
;mini=true
on:
   mkdir /config/Ryazhenka/8GB/
   mv /payload.bin /config/Ryazhenka/8GB/payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/Ultra/payload 8GB.bin' /payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/Ultra/payload 8GB.bin' /atmosphere/reboot_payload.bin
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/System/Ultra/payload 8GB.bin' /bootloader/update.bin
   set-ini-val ./config.ini '8GB Patch' value On
off:
   cp /config/Ryazhenka/8GB/payload.bin /payload.bin
   cp /config/Ryazhenka/8GB/payload.bin /bootloader/update.bin
   mv /config/Ryazhenka/8GB/payload.bin /atmosphere/reboot_payload.bin
   set-ini-val ./config.ini '8GB Patch' value Off

[Info]
;system=mariko
;mode=table
;spacing=8
;info_text_color=warning
'' = '8 ГБ RAM: используйте только'
'' = 'на совместимой 8 ГБ Mariko.'
