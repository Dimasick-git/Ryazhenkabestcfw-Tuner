[Установить Ryazha-clk]
;mode=action
;color=#8B5CF6
try:
   mkdir /config/ryazhahand/downloads/Ryazhenka/
   echo "Скачиваю Ryazha-clk 3.0..."
   download 'https://github.com/Dimasick-git/Sys-clk/releases/latest/download/Ryazha-clk.zip' /config/ryazhahand/downloads/Ryazhenka/Ryazha-clk.zip
   unzip /config/ryazhahand/downloads/Ryazhenka/Ryazha-clk.zip /
   del /config/ryazhahand/downloads/Ryazhenka/
   echo "Ryazha-clk установлен."
   echo "Перезагрузите консоль."
try:
   echo "Ryazha-clk 3.0 ещё не опубликован."

