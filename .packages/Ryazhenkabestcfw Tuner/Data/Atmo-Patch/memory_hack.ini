;show_widget=true

[@Настройка]

[Патч памяти]

[*INI загрузчика]
;mode=option
file_source '/bootloader/hekate_ipl.ini'
file_source '/bootloader/ini/*.ini'
filter '/bootloader/ini/hekate_ipl.ini'

set-footer '{file_name}'
set-ini-val './config.ini' '*INI загрузчика' 'ini_path' '{file_source}'


[*Ядро Mesosphere]
;mode=option
json '{"1.11":"(1.85 MB,stripped)", "1.10":"(1.85 MB,stripped)", "1.9":"(1.85 MB,stripped)", "null":"(stripped)"}'
list_source '{json({split({ams_version},".",0)}.{split({ams_version},".",1)})}'
set-footer '{list_source(*)}'
json '{"stripped":"notify"}'
{json({list_source(*)})} "  Веб-браузер перестанет работать." 24

[gap]
;mode=table
;background=false
;gap=12


[Применить патч]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
try:
path_exists '{ini_file("*INI загрузчика",ini_path)}{json({ini_file("*Ядро Mesosphere",footer)})}'

json '{"1.85 MB":"1.85MB_{split({ams_version},".",0)}.{split({ams_version},".",1)}","stripped":"stripped_{split({ams_version},".",0)}.{split({ams_version},".",1)}"}'
path_exists './data/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin'
cp './data/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin' '/atmosphere/'
set-ini-val-matching-key '{ini_file("*INI загрузчика",ini_path)}' 'pkg3' kernel 'atmosphere/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin'
set-ini-val-matching-key '{ini_file("*INI загрузчика",ini_path)}' 'fss0' kernel 'atmosphere/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin'
notify '  Требуется перезагрузка.'

[Удалить патч]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
try:
path_exists '{ini_file("*INI загрузчика",ini_path)}{json({ini_file("*Ядро Mesosphere",footer)})}'
remove-ini-key-matching-key '{ini_file("*INI загрузчика",ini_path)}' 'pkg3' kernel
remove-ini-key-matching-key '{ini_file("*INI загрузчика",ini_path)}' 'fss0' kernel
notify '  Требуется перезагрузка.'


[*Вручную]
[*Применить патч]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
ini_file_source '{ini_file("*INI загрузчика",ini_path)}{json({ini_file("*Ядро Mesosphere",footer)})}'
filter config

json '{"1.85 MB":"1.85MB_{split({ams_version},".",0)}.{split({ams_version},".",1)}","stripped":"stripped_{split({ams_version},".",0)}.{split({ams_version},".",1)}"}'

try:
path_exists './data/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin'
set-ini-val '{ini_file("*INI загрузчика",ini_path)}' '{ini_file_source(*)}' kernel 'atmosphere/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin'
cp './data/mesosphere_{json({ini_file("*Ядро Mesosphere",footer)})}.bin' '/atmosphere/'
notify '  Требуется перезагрузка.'


[*Удалить патч]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
ini_file_source '{ini_file("*INI загрузчика",ini_path)}{json({ini_file("*Ядро Mesosphere",footer)})}'
filter config
remove-ini-key '{ini_file("*INI загрузчика",ini_path)}' '{ini_file_source(*)}' kernel
notify '  Требуется перезагрузка.'



[Команды]

[Перезагрузка]
;hold=true
reboot

[@Просмотр INI]

[INI загрузчика]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;section_text_color=header
ini_file './config.ini'
json '{"null.ini":"Недоступно", "{ini_file(*INI загрузчика,footer)}.ini":"{ini_file(*INI загрузчика,footer)}.ini"}'
'{json({ini_file(*INI загрузчика,footer)}.ini)}'=''

[Содержимое INI]
;mode=table
;wrapping_mode=char
;wrapping_indent=true
;spacing=4
ini_file './config.ini'
list_file_source '{ini_file("*INI загрузчика",ini_path)}'
