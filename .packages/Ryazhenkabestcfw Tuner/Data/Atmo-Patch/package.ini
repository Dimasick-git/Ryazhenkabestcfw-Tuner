;title='Набор памяти'
;creator='ppkantorski'
;version=1.0.2
;about='Внутренний модуль памяти для Atmosphere и Ryazhahand Overlay.'
;color=red
;show_widget=true

[@Настройка]

[Настройка]
[*Патч памяти]
;mode=forwarder
package_source ./memory_hack.ini

[*Память оверлея]
;mode=option
;selection_mini=true
list_source '(⋯, 10 MB, 12 MB, 14 MB, 16 MB, 18 MB, 20 MB, 22 MB, 24 MB, 26 MB, 28 MB, 30 MB, 32 MB, 34 MB, 36 MB, 38 MB, 40 MB)'
set-ini-val /config/ryazhahand/config.ini memory custom_overlay_memory_MB '{split({list_source(*)}," ",0)}'
set-footer '{list_source(*)}'


[Дополнительно]
[*Команды]
;mode=forwarder
package_source ./configure_commands.ini

