[@Сброс]
[Сброс]

[Удалить буферы]
remove-ini-key /config/ryazhahand/config.ini memory copy_buffer_size
remove-ini-key /config/ryazhahand/config.ini memory download_read_buffer
remove-ini-key /config/ryazhahand/config.ini memory download_write_buffer
remove-ini-key /config/ryazhahand/config.ini memory unzip_read_buffer
remove-ini-key /config/ryazhahand/config.ini memory unzip_write_buffer
remove-ini-key /config/ryazhahand/config.ini memory hex_buffer_size
remove-ini-section ./config.ini '*Copy Buffer'
remove-ini-section ./config.ini '*Download Read Buffer'
remove-ini-section ./config.ini '*Download Write Buffer'
remove-ini-section ./config.ini '*Unzip Read Buffer'
remove-ini-section ./config.ini '*Unzip Write Buffer'
remove-ini-section ./config.ini '*Hex Buffer'

[Сбросить память интерпретатора]
remove-ini-key /config/ryazhahand/config.ini memory interpreter_heap
remove-ini-section ./config.ini '*Interpreter Heap'