;show_widget=true

[@Настройка]

[Патч памяти]

[*Bootloader INI]
;mode=option
file_source '/bootloader/hekate_ipl.ini'
file_source '/bootloader/ini/*.ini'
filter '/bootloader/ini/hekate_ipl.ini'

set-footer '{file_name}'
set-ini-val './config.ini' '*Bootloader INI' 'ini_path' '{file_source}'


[*mesosphere вариант]
;mode=option
json '{"1.11":"(1.85 MB,stripped)", "1.10":"(1.85 MB,stripped)", "1.9":"(1.85 MB,stripped)", "null":"(stripped)"}'
list_source '{json({split({ams_version},".",0)}.{split({ams_version},".",1)})}'
set-footer '{list_source(*)}'
json '{"stripped":"notify"}'
{json({list_source(*)})} "  Сломает системный браузер." 24

[gap]
;mode=table
;background=false
;gap=12


[Применить патч]
;info_text_color=warning
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
try:
path_exists '{ini_file("*Bootloader INI",ini_path)}{json({ini_file("*mesosphere вариант",footer)})}'

json '{"1.85 MB":"1.85MB_{split({ams_version},".",0)}.{split({ams_version},".",1)}","stripped":"stripped_{split({ams_version},".",0)}.{split({ams_version},".",1)}"}'
path_exists './data/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin'
cp './data/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin' '/atmosphere/'
set-ini-val-matching-key '{ini_file("*Bootloader INI",ini_path)}' 'pkg3' kernel 'atmosphere/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin'
set-ini-val-matching-key '{ini_file("*Bootloader INI",ini_path)}' 'fss0' kernel 'atmosphere/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin'
notify '  Требуется перезагрузка.'

[Снять патч]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
try:
path_exists '{ini_file("*Bootloader INI",ini_path)}{json({ini_file("*mesosphere вариант",footer)})}'
remove-ini-key-matching-key '{ini_file("*Bootloader INI",ini_path)}' 'pkg3' kernel
remove-ini-key-matching-key '{ini_file("*Bootloader INI",ini_path)}' 'fss0' kernel
notify '  Требуется перезагрузка.'


[*Точечное применение]
[*Применить к секции]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
ini_file_source '{ini_file("*Bootloader INI",ini_path)}{json({ini_file("*mesosphere вариант",footer)})}'
filter config

json '{"1.85 MB":"1.85MB_{split({ams_version},".",0)}.{split({ams_version},".",1)}","stripped":"stripped_{split({ams_version},".",0)}.{split({ams_version},".",1)}"}'

try:
path_exists './data/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin'
set-ini-val '{ini_file("*Bootloader INI",ini_path)}' '{ini_file_source(*)}' kernel 'atmosphere/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin'
cp './data/mesosphere_{json({ini_file("*mesosphere вариант",footer)})}.bin' '/atmosphere/'
notify '  Требуется перезагрузка.'


[*Удалить из секции]
ini_file './config.ini'
json '{"1.85 MB":"","stripped":""}'
ini_file_source '{ini_file("*Bootloader INI",ini_path)}{json({ini_file("*mesosphere вариант",footer)})}'
filter config
remove-ini-key '{ini_file("*Bootloader INI",ini_path)}' '{ini_file_source(*)}' kernel
notify '  Требуется перезагрузка.'



[Команды]

[Перезагрузка]
;hold=true
reboot

[@Просмотр INI]

[Bootloader INI Header]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;section_text_color=header
ini_file './config.ini'
json '{"null.ini":"Не доступен", "{ini_file(*Bootloader INI,footer)}.ini":"{ini_file(*Bootloader INI,footer)}.ini"}'
'{json({ini_file(*Bootloader INI,footer)}.ini)}'=''

[Bootloader INI Table]
;mode=table
;wrapping_mode=char
;wrapping_indent=true
;spacing=4
ini_file './config.ini'
list_file_source '{ini_file("*Bootloader INI",ini_path)}'
