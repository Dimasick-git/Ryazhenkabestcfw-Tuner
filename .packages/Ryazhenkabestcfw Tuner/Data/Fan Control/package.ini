color=#FFB84D
show_widget=true

[@Вентиляторы]

[Header]
;mode=table
;background=false
;header_indent=true
;gap=18
'Вентиляторы' = '{DRIGHT}'

[Info]
;mode=table
;background=false
;spacing=4
;gap=10
'Работает через параметры' = 'Atmosphère.'
'Не возвращает разгон CPU,' = ''
'GPU или ОЗУ.' = ''
'После применения' = 'перезагрузите консоль.'

[Применить кривую]
;mode=action
try:
  exec применить
  echo "Кривая вентилятора применена."
  echo "Перезагрузите консоль."
except:
  echo "Ошибка применения кривой"
end

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=4
;gap=10
ini_file './config.ini'
'Готовые кривые' = '{ini_file(Предустановка,footer)}'

[Тихая]
;mode=action
try:
  set-ini-val './config.ini' Предустановка footer 'Тихая'
  set-ini-val './config.ini' 36°C?Док value 0
  set-ini-val './config.ini' 40°C?Док value 30
  set-ini-val './config.ini' 47°C?Док value 65
  set-ini-val './config.ini' 50°C?Док value 90
  set-ini-val './config.ini' 54°C?Док value 125
  set-ini-val './config.ini' 58°C?Док value 180
  set-ini-val './config.ini' 33°C?Порт value 0
  set-ini-val './config.ini' 36°C?Порт value 10
  set-ini-val './config.ini' 43°C?Порт value 35
  set-ini-val './config.ini' 47°C?Порт value 60
  set-ini-val './config.ini' 50°C?Порт value 80
  set-ini-val './config.ini' 54°C?Порт value 120
  exec применить
  refresh
except:
  echo "Ошибка применения тихой кривой"
end

