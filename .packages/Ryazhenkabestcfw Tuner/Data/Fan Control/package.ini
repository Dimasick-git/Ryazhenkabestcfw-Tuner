[Сброс к стоку]
;mode=action
try:
  remove-ini-key /atmosphere/config/system_settings.ini tc tskin_rate_table_console_on_fwdbg
  remove-ini-key /atmosphere/config/system_settings.ini tc tskin_rate_table_handheld_on_fwdbg
