[Применить + рестарт]
;mode=action
try:
  exec применить
  echo "Кривая сохранена. Консоль перезагружается..."
  reboot
except:
  echo "Ошибка применения кривой"
end

[Сброс + рестарт]
;mode=action
try:
  set-ini-val './config.ini' Предустановка footer 'Сток Atmosphère'
  set-ini-val './config.ini' 36°C?Док value 0
  set-ini-val './config.ini' 40°C?Док value 50
  set-ini-val './config.ini' 47°C?Док value 90
  set-ini-val './config.ini' 50°C?Док value 120
  set-ini-val './config.ini' 54°C?Док value 170
  set-ini-val './config.ini' 58°C?Док value 255
  set-ini-val './config.ini' 33°C?Порт value 0
  set-ini-val './config.ini' 36°C?Порт value 50
  set-ini-val './config.ini' 43°C?Порт value 50
  set-ini-val './config.ini' 47°C?Порт value 90
  set-ini-val './config.ini' 50°C?Порт value 120
  set-ini-val './config.ini' 54°C?Порт value 170
  exec применить
  echo "Стандартная кривая сохранена. Консоль перезагружается..."
  reboot
except:
  echo "Ошибка сброса кривой"
end
