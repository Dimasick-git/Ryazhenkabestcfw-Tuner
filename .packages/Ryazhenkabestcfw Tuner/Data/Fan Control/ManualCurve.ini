color=#FFB84D
show_widget=true

[@Ручная кривая]

[Header]
;mode=table
;background=false
;header_indent=true
;gap=18
'Ручная кривая' = '{DRIGHT}'

[Info]
;mode=table
;background=false
;spacing=4
;gap=10
'Скорость: 0–255' = ''
'Настройте точки.' = ''
'Затем примените.' = ''
'Консоль перезагрузится.' = ''

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;background=false
;header_indent=true
;gap=12
'Портативный режим' = '{DRIGHT}'

[33°C?Порт]
;mode=trackbar
;unlocked=false
;min_value=0
;max_value=255
;units=
set-ini-val './config.ini' Предустановка footer 'Ручная'
exec применить

