[Загрузки]

[*Хоумбрю]

[DBI — последняя версия]
try:
mkdir /config/ryazhahand/downloads/Ryazhenka/
download https://github.com/Dimasick-git/Ryazhenka-resore/releases/latest/download/DBI.RU.zip /config/ryazhahand/downloads/Ryazhenka/DBI.RU.zip
unzip /config/ryazhahand/downloads/Ryazhenka/DBI.RU.zip /switch/DBI/
del /config/ryazhahand/downloads/Ryazhenka/

[Sphaira — с конфигурацией]
try:
mkdir /config/ryazhahand/downloads/Ryazhenka/
download https://github.com/ITotalJustice/sphaira/releases/latest/download/sphaira.zip /config/ryazhahand/downloads/Ryazhenka/sphaira.zip
unzip /config/ryazhahand/downloads/Ryazhenka/sphaira.zip /
cp /switch/sphaira/sphaira.nro /hbmenu.nro
del /config/ryazhahand/downloads/Ryazhenka/

set-ini-val /config/sphaira/config.ini config theme romfs:/themes/oled_black_theme.ini
set-ini-val /config/sphaira/config.ini config mtp_enabled 1
set-ini-val /config/sphaira/config.ini config replace_hbmenu 0
set-ini-val /config/sphaira/config.ini config install_emummc 1
set-ini-val /config/sphaira/config.ini config install_prompt 0
set-ini-val /config/sphaira/config.ini homebrew layout 1
set-ini-val /config/sphaira/config.ini homebrew hide_sphaira 0
set-ini-val /config/sphaira/config.ini filebrowser show_hidden 1

