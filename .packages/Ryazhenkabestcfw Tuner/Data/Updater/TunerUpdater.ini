[Обновить тюнер]
;mode=action
try:
  mkdir /config/ryazhahand/downloads/Ryazhenka/
  echo "Скачиваю обновление тюнера..."
  download 'https://github.com/Dimasick-git/Ryazhenkabestcfw-Tuner/releases/latest/download/Ryazhenkabestcfw_Tuner.zip' /config/ryazhahand/downloads/Ryazhenka/Ryazhenkabestcfw_Tuner.zip
  unzip /config/ryazhahand/downloads/Ryazhenka/Ryazhenkabestcfw_Tuner.zip /
  del /config/ryazhahand/downloads/Ryazhenka/
  echo "Тюнер успешно обновлён!"
  refresh
except:
  echo "Ошибка обновления тюнера"
end

