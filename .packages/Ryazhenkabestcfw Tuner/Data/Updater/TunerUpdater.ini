color=#FFB84D
show_widget=true

[@Обновление]

[Header]
;mode=table
;header_indent=true
;background=false
;gap=17
ini_file '/switch/.packages/Ryazhenkabestcfw Tuner/config.ini'
'Текущая версия: {ini_file(Updater,current)}'= 'Ряженка'

[Gap]
;mode=table
;background=false
;gap=15

[Обновить тюнер]
try:
json '[{"asset":"Ryazhenkabestcfw_Tuner.zip"}]'
download 'https://github.com/Dimasick-git/Ryazhenkabestcfw-Tuner/releases/latest/download/{json(0,asset)}' '/switch/{json(0,asset)}'
unzip '/switch/{json(0,asset)}' '/'
del '/switch/{json(0,asset)}'
echo "Тюнер успешно обновлён!"
refresh

[Gap]
;mode=table
;background=false
;gap=15

[Загрузчик OC - Обновить]
try:
get-ini-val /prod.info product_name HOS_VERSION
if '{HOS_VERSION}' >= '21.0.0':
    echo "ВНИМАНИЕ: Обновление loader.kip ЗАБЛОКИРОВАНО!"
    echo "=========================================="
    echo "Ваша версия HOS: {HOS_VERSION}"
    echo "Требуемая версия: < 21.0.0"
    echo "=========================================="
    echo "ПРИЧИНА: loader.kip вызывает черный экран"
    echo "на HOS 21.0.0 и выше"
    echo ""
    echo "РЕШЕНИЕ: Используйте sys-clk для разгона"
    echo "Sys-clk работает на ВСЕХ версиях HOS"
    echo "=========================================="
elif '{HOS_VERSION}' < '21.0.0':
    echo "Версия HOS: {HOS_VERSION} - ПОДХОДИТ"
    echo "Загружаю loader.kip..."
    download 'https://github.com/Dimasick-git/RCU/releases/latest/download/kip.zip' '/switch/kip.zip'
    unzip '/switch/kip.zip' '/atmosphere/kips/'
    del '/switch/kip.zip'
    echo "loader.kip успешно обновлен!"
else:
    echo "Не удалось определить версию HOS"
    echo "Версия: {HOS_VERSION}"
end
refresh





