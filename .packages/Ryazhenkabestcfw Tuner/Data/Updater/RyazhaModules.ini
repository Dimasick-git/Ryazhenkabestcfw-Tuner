[Minecraft Online]
;mode=action
;color=#10B981
'Minecraft Online (мод)' = ''
try:
  echo "Скачиваю Minecraft Online..."
  download 'https://api.github.com/repos/Dimasick-git/Minecraft-Online-for-switch/releases/tags/v1.0' /config/ryazhahand/downloads/РяженкаNX/zip-url.json
  json_file /config/ryazhahand/downloads/РяженкаNX/zip-url.json
  download {json_file(0,assets,0,browser_download_url)} /config/ryazhahand/downloads/РяженкаNX/downloads.zip
  unzip /config/ryazhahand/downloads/РяженкаNX/downloads.zip /
  del /config/ryazhahand/downloads/РяженкаNX/
  echo "Minecraft Online установлен!"
except:
  echo "Ошибка установки Minecraft Online"
end

