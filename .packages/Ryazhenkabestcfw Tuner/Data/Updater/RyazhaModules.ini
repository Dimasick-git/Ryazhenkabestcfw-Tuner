  mkdir /config/ryazhahand/downloads/Ryazhenka/
  download 'https://github.com/Dimasick-git/Ryazhahand-Overlay/releases/latest/download/sdout.zip' /config/ryazhahand/downloads/Ryazhenka/Ryazhahand.zip
  unzip /config/ryazhahand/downloads/Ryazhenka/Ryazhahand.zip /
  del /config/ryazhahand/downloads/Ryazhenka/
