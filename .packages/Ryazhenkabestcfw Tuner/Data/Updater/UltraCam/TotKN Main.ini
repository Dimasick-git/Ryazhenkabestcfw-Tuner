;color=#2277FF
;show_widget=true



[@Настройки]


[Header]
;mode=table
;background=false
;header_indent=true
;gap=17
'UltraCam' = 'Calamity v3.0.0'

[Переустановить]
try:
mkdir /config/ryazhahand/downloads/Ryazhenka/mods/
mkdir /config/Ryazhenka/Mods/
download https://github.com/Dimasick-git/Ryazhenka-resore/releases/download/resources/UltraCam-TotKN.zip /config/ryazhahand/downloads/Ryazhenka/mods/downloads.zip
unzip /config/ryazhahand/downloads/Ryazhenka/mods/downloads.zip /
del /config/ryazhahand/downloads/Ryazhenka/mods/

cp './TotKN Main.ini' './TotK.ini'
cp './TotKN Main.ini' '/config/Ryazhenka/Mods/TotK.ini'

exec TotK
refresh
try:
unzip /config/Ryazhenka/Tuner/mod-cache/UltraCam-TotKN.zip /
mkdir /config/Ryazhenka/Mods/

cp './TotKN Main.ini' './TotK.ini'
cp './TotKN Main.ini' '/config/Ryazhenka/Mods/TotK.ini'

exec TotK
refresh

[Удалить мод]
del /atmosphere/contents/0100F2C0115B6000/exefs/
del /atmosphere/exefs_patches/ZeldaToTK_TripleBuffer/
del /UltraCam/TOTK/

del '/config/Ryazhenka/Mods/TotK.ini'
cp './TotK Init.ini' './TotK.ini'
refresh



[Gap]
;mode=table
;background=false
;gap=17

[Info]
;mode=table
;gap=5
'Управление справа' = ''
'' = '{DRIGHT}'

[Экран]

[Разрешение в доке?New]
;mode=named_step_trackbar
;unlocked=true
json_source '[{"name":"720p", "width":"1280", "height":"720"}, {"name":"900p", "width":"1600", "height":"900"}, {"name":"1080p", "width":"1920", "height":"1080"}]' name
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution Width {json_source(*,width)}
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution Height {json_source(*,height)}

[Gap]
;mode=table
;background=false
;gap=5

[Info]
;mode=table
;background=false
;end_gap=5
;gap=17
'1080p: только с 8 ГБ ОЗУ' = ''


[Портативный режим?New]
;mode=named_step_trackbar
;unlocked=true
json_source '[{"name":"540p", "width":"960", "height":"540"}, {"name":"576p", "width":"1024", "height":"576"}, {"name":"720p", "width":"1280", "height":"720"}]' name
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Handheld Width {json_source(*,width)}
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Handheld Height {json_source(*,height)}

[Лимит кадров?New]
;mode=named_step_trackbar
;unlocked=true
list_source '(30.00, 45.00, 60.00)'
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini UltraCamFPS MaxFPS {list_source(*)}

[Кадры в меню?New]
;mode=named_step_trackbar
;unlocked=true
list_source '(30.00, 45.00, 60.00)'
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini UltraCamFPS mMenuFPS {list_source(*)}

[Угол обзора?New]
;mode=named_step_trackbar
;unlocked=true
list_source '(50, 55, 60, 65, 70, 75, 80, 85, 90)'
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Gameplay Fov {list_source(*)}







[Графика]

[Разрешение теней?New]
;mode=named_step_trackbar
;unlocked=true
list_source '(128, 256, 512, 1024)'
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution ShadowResolution {list_source(*)}

[Дальность отрисовки?New]
;mode=named_step_trackbar
;unlocked=true
list_source '(10000, 15000, 20000, 25000, 30000, 35000, 40000)'
set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution RenderDistance {list_source(*)}

[Качество графики?New]
;mode=toggle
;mini=true
on:
   set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution QualityImprovements True
off:
   set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution QualityImprovements False

[FXAA?New]
;mode=toggle
;mini=true
on:
   set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution FXAA True
off:
   set-ini-val /UltraCam/TOTK/Config/maxlastbreath.ini Resolution FXAA False



