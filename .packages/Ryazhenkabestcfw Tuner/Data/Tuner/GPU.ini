color=#FFB84D
show_widget=true

[@ГПУ]

[Gap]
;mode=table
;background=false
;gap=12

[Header]
;mode=table
;background=false
;header_indent=true
;polling=true
;info_text_color=#AAAAAA
;gap=22
hex_file '/atmosphere/kips/loader.kip'
'GPU'= 'Инфо {DRIGHT}'
json '[{"null":"разблок", "00":"разблок", "01":"блок"}]'
'GPU Статус' = '{json(0,{hex_file(CUST,256,1)})}'

[Разблок 1305+ МГц]
;system=mariko
;mode=toggle
on:
   hex-by-custom-offset /atmosphere/kips/loader.kip CUST 256 00
off:
   hex-by-custom-offset /atmosphere/kips/loader.kip CUST 256 01

[Разблок 1075+ МГц]
;system=erista
;mode=toggle
on:
   hex-by-custom-offset /atmosphere/kips/loader.kip CUST 256 00
off:
   hex-by-custom-offset /atmosphere/kips/loader.kip CUST 256 01

[Андервольт?GPU]
;mode=named_step_trackbar
;unlocked=true
mariko:
json_file_source './GPU/GPU UV M.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 40 {json_file_source(*,dec)}
erista:
json_file_source './GPU/GPU UV E.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 36 {json_file_source(*,dec)}

[Мин. напр. → Макс. смещ.]
;system=mariko
;mode=named_step_trackbar
;unlocked=true
json_file_source './GPU/GPU DVFS.json' name
set-ini-val /config/sys-clk/config.ini values gpu_vmin_offset {json_file_source(*,dec)}
set-ini-val /config/sys-clk/config.ini values auto_gpu_vmin 2

[Смещение напр.?GPU]
;mode=named_step_trackbar
;unlocked=true
json_file_source './GPU/GPU Off.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 44 {json_file_source(*,dec)}

[*Мин. напр.?GPU]
;mode=option
;selection_mini=true
mariko:
json_file_source './GPU/GPU vMin M.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 56 {json_file_source(*,dec)} 4
set-footer '{json_file_source(*,label)}'
back
erista:
json_file_source './GPU/GPU vMin E.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 48 {json_file_source(*,dec)} 4
set-footer '{json_file_source(*,label)}'
back

[*Макс. напр.?GPU]
;system=mariko
;mode=option
;selection_mini=true
json_file_source './GPU/GPU vMax.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 60 {json_file_source(*,dec)}
set-footer '{json_file_source(*,dec)} мВ'
back

[*Кастомная таблица]
;mode=forwarder
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/UV3.ini'
exec UV3

[@Инфо]

[Gap]
;mode=table
;background=false
;gap=20

[Header]
;mode=table
;spacing=10
;gap=18
'Дополнительно' = ''

[*Кастомная таблица]
;mode=forwarder
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/UV3.ini'
exec UV3

[Gap]
;mode=table
;background=false
;gap=20

[Footer]
;mode=table
;color=#AAAAAA
'Ряженка BEST CFW 2026' = ''
'| Настройки GPU' = ''

[Info]
;mode=table
;system=erista
;gap=40
'Разблок 1075+ МГц:'=''
''='Открывает 1075 и 1152 МГц'
''='Если Макс. напр. < МГц - скрыто'

[Info]
;mode=table
;spacing=10
;gap=40
