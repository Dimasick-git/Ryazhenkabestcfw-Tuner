color=#FFB84D
show_widget=true

[@Tuner]

[Header]
;mode=table
;background=false
;header_indent=true
;gap=22
'Тюнер Ряженка' = '{DRIGHT}'

[Gap]
;mode=table
;background=false
;gap=12

[Info]
;mode=table
;background=false
;spacing=4
;gap=14
'OC + пресеты + система' = ''
'Применение OC: перезагрузка' = ''

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Главное меню' = ''

[*Статус системы]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/Status Dashboard.ini'

[*Быстрые действия]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/QuickActions.ini'

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Ручная настройка' = ''

[*Настройка CPU]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/CPU.ini'
exec CPU

[*Настройка GPU]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/GPU.ini'
exec GPU

[*Настройка RAM]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/RAM.ini'
exec RAM

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Готовые пресеты' = ''

[*Готовые пресеты]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/ReadyPresets.ini'

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Управление пресетами' = ''

[*Менеджер пресетов]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Presets/Presets Manager.ini'
exec Preset

[*Менеджер бэкапов]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Presets/Backup Manager.ini'

[*Настройка вентиляторов]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Fans/Curves Manager.ini'

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Применение настроек' = ''

[Применить частоты]
;mode=action
;helper_text=false
try:
  ini_file '/switch/.packages/Ryazhenkabestcfw Tuner/config.ini'
  exec '{ini_file(OC Autobackup,value)}'
  reboot
except:
end

[Gap]
;mode=table
;background=false
;gap=14

[Header]
;mode=table
;spacing=2
;gap=10
'Поддержка' = ''

[*Чат поддержки]
;mode=forwarder
;helper_text=false
package_source '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Tuner/Support Chat.ini'

[Gap]
;mode=table
;background=false
;gap=18

[Footer]
;mode=table
;color=#AAAAAA
;spacing=4
'Ряженка BEST CFW 2026' = ''
'| Тюнер v10.6 | Mariko/Erista' = ''
