color=#FFB84D
show_widget=true

[@Рам]

[Gap]
;mode=table
;background=false
;gap=12

[Header]
;mode=table
;background=false
;header_indent=true
;gap=22
'RAM'= 'Инфо {DRIGHT}'

[*Макс. част. МГц?RAM]
;mode=option
;selection_mini=true
mariko:
json_file_source './RAM/RAM MHz M.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 80 '{json_file_source(*,dec)}000'
set-footer '{json_file_source(*,dec)} МГц'
back
erista:
json_file_source './RAM/RAM MHz E.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 76 '{json_file_source(*,dec)}'
set-footer '{json_file_source(*,label)}'
back

[DRAM HP Режим]
;mode=toggle
on:
    hex-by-custom-offset /atmosphere/kips/loader.kip CUST 64 01
off:
    hex-by-custom-offset /atmosphere/kips/loader.kip CUST 64 00

[*Напр. Vdd2]
;mode=option
;selection_mini=true
mariko:
json_file_source './RAM/RAM Vdd2 M.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 68 {json_file_source(*,dec)}
set-footer '{json_file_source(*,label)}'
back
erista:
json_file_source './RAM/RAM Vdd2 E.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 68 {json_file_source(*,dec)}
set-footer '{json_file_source(*,label)}'
back

[*Напр. Vddq]
;mode=option
;system=mariko
;selection_mini=true
json_file_source './RAM/RAM Vddq.json' name
hex-by-custom-rdecimal-offset /atmosphere/kips/loader.kip CUST 72 {json_file_source(*,dec)}
set-footer '{json_file_source(*,label)}'
back

[*EMC DVB Таблица]
;mode=option
mariko:
json_file_source './RAM/RAM DVB M.json' name
hex-by-custom-offset /atmosphere/kips/loader.kip CUST 84 {json_file_source(*,hex)}
clear hex_sum_cache
hex_file '/atmosphere/kips/loader.kip'
json '[{"null":"...","00000000":"Не задано","01000000":"+25 mV","02000000":"+50 mV","03000000":"+75 mV","04000000":"+100 mV","05000000":"+125 mV","FFFFFFFF":"-25 mV","FEFFFFFF":"-50 mV","FDFFFFFF":"-75 mV"}]'
set-footer '{json(0,{hex_file(CUST,84,4)})}'
back
erista:
json_file_source './RAM/RAM DVB E.json' name
hex-by-custom-offset /atmosphere/kips/loader.kip CUST 84 {json_file_source(*,hex)}
clear hex_sum_cache
hex_file '/atmosphere/kips/loader.kip'
json '[{"null":"...","00000000":"Не задано","01000000":"+25 mV","02000000":"+50 mV","03000000":"+75 mV","04000000":"+100 mV","05000000":"+125 mV","FFFFFFFF":"-25 mV","FEFFFFFF":"-50 mV","FDFFFFFF":"-75 mV"}]'
set-footer '{json(0,{hex_file(CUST,84,4)})}'
back

[Gap]
;mode=table
;background=false
;gap=30

[Header]
;mode=table
;background=false
;header_indent=true
;polling=true
;info_text_color=#AAAAAA
;gap=25
hex_file '/atmosphere/kips/loader.kip'
json_file '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Presets/Boot Jsons/RAM Timings.json'
'Основн. тайминги'= '({json_file(0,{hex_file(CUST,88,1)})}-{json_file(0,{hex_file(CUST,92,1)})}-{json_file(0,{hex_file(CUST,96,1)})})-{json_file(0,{hex_file(CUST,100,1)})}-{json_file(0,{hex_file(CUST,104,1)})}-{json_file(0,{hex_file(CUST,108,1)})}-{json_file(0,{hex_file(CUST,112,1)})}-{json_file(0,{hex_file(CUST,116,1)})}'
'Текущая частота' = '{slice({hex_to_decimal({hex_to_rhex({hex_file(CUST,80,3)})})},0,4)} МГц'

