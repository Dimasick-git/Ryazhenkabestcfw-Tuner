[Установить / обновить Ryazha-clk]
;mode=action
;color=#8B5CF6
try:
  mkdir /config/ryazhahand/downloads/Ryazhenka/
  echo "Скачиваю Ryazha-clk..."
  download 'https://github.com/Dimasick-git/Sys-clk/releases/latest/download/sys-clk-overlay.zip' /config/ryazhahand/downloads/Ryazhenka/Ryazha-clk.zip
  unzip /config/ryazhahand/downloads/Ryazhenka/Ryazha-clk.zip /
  del /config/ryazhahand/downloads/Ryazhenka/
  echo "Ryazha-clk установлен!"
  echo "Перезагрузите Switch."
except:
  echo "Ошибка установки Ryazha-clk"
end

