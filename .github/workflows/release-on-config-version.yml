name: Release on config version change

on:
  push:
    branches: [ main ]

jobs:
  release-on-config:
    name: Create release when config.ini version changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine old and new versions
        id: versions
        run: |
          set -euo pipefail
          # Path to the package config that contains the version
          cfg_path="switch/.packages/Ryazhenkabestcfw Tuner/config.ini"

          # helper to read 'current=' value from a file or from git at a given ref
          read_version() {
            local src="$1"; shift
            grep -Po '^current=\K.*' "$src" 2>/dev/null | tr -d '\r' || true
          }

          new_version=""
          if [ -f "$cfg_path" ]; then
            new_version=$(read_version "$cfg_path")
          fi

          prev_version=""
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # attempt to read the file content from the previous commit
            if git cat-file -e "${{ github.event.before }}:$cfg_path" 2>/dev/null; then
              prev_version=$(git show "${{ github.event.before }}:$cfg_path" 2>/dev/null | grep -Po '^current=\K.*' 2>/dev/null | tr -d '\r' || true)
            fi
          fi

          # semver compare helper: convert X.Y.Z to comparable integer
          semver_to_num() {
            v="$1"
            IFS='.' read -r maj min pat <<< "${v}"
            maj=${maj:-0}; min=${min:-0}; pat=${pat:-0}
            printf "%06d%06d%06d" "$maj" "$min" "$pat"
          }

          changed=false
          if [ -n "$new_version" ]; then
            if [ -z "$prev_version" ]; then
              # no previous version found — treat as changed
              changed=true
            else
              nnum=$(semver_to_num "$new_version")
              pnum=$(semver_to_num "$prev_version")
              if [ "$nnum" -gt "$pnum" ]; then
                changed=true
              fi
            fi
          fi

          echo "prev_version=$prev_version" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "changed=$changed" >> $GITHUB_OUTPUT

      - name: Collect changed files
        if: steps.versions.outputs.changed == 'true'
        id: changed_files
        run: |
          set -e
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            files=""
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          # Save multiline output
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package release artifact (atmosphere, config, switch)
        if: steps.versions.outputs.changed == 'true'
        id: package
        run: |
          set -e
          version=${{ steps.versions.outputs.new_version }}
          zip_name="Ryazhenkabestcfw_Tuner_v${version}.zip"
          zip_name_unversioned="Ryazhenkabestcfw_Tuner.zip"
          rm -f "$zip_name" "$zip_name_unversioned"
          # Pack only existing relevant directories
          paths=""
          [ -d "atmosphere" ] && paths="$paths atmosphere"
          [ -d "config" ] && paths="$paths config"
          [ -d "switch" ] && paths="$paths switch"
          if [ -z "$paths" ]; then
            echo "No paths found to package" >&2
            touch "$zip_name"
          else
            zip -r "$zip_name" $paths -x "**/.git/**" || true
          fi
          # Also create an unversioned copy
          cp "$zip_name" "$zip_name_unversioned" || true
          echo "zip=$zip_name" >> $GITHUB_OUTPUT
          echo "zip_unversioned=$zip_name_unversioned" >> $GITHUB_OUTPUT
          echo "files=$zip_name,$zip_name_unversioned" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload artifact
        if: steps.versions.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.versions.outputs.new_version }}
          name: "Ryazhenka Tuner v${{ steps.versions.outputs.new_version }}"
          body: |
            Automatic release created because config.ini version changed: ${{ steps.versions.outputs.prev_version }} → ${{ steps.versions.outputs.new_version }}

            Changed files:
            ${{ steps.changed_files.outputs.files }}

            Packaged paths: atmosphere, config, switch (if present)
          files: ${{ steps.package.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
