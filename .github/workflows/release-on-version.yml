name: Publish Ryazhenkabestcfw Tuner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish one SD archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='.packages/Ryazhenkabestcfw Tuner/config.ini'
          VERSION=$(grep -E '^current=' "$CONFIG" | head -n 1 | cut -d= -f2 | tr -d '\r')
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check kernel compatibility
        run: |
          python3 -m pip install unicorn==2.1.4
          python3 tools/update_memory_kernels.py --verify

      - name: Build SD archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-stage Ryazhenkabestcfw_Tuner.zip
          mkdir -p release-stage/switch
          cp -a .packages release-stage/switch/.packages
          (
            cd release-stage
            zip -qr ../Ryazhenkabestcfw_Tuner.zip switch
          )
          unzip -tq Ryazhenkabestcfw_Tuner.zip

      - name: Publish release archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Ryazhenka Tuner v${{ steps.version.outputs.value }}
          body: |
            • Отдельная вкладка «Моды»: только Zelda, настройки на русском и сохранение TotK.
            • Патчи памяти для Atmosphere 1.12 / HOS 23 с совместимостью старых homebrew, обновлён 8GB payload.
            • Исправлены загрузки модулей; ресурсы и моды берутся из репозитория Ряженки.

            Распакуйте архив в корень SD. Патч +40 МБ отключает веб-браузер.
          files: Ryazhenkabestcfw_Tuner.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
