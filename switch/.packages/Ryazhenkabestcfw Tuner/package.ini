;try
;system=mariko
;mode=toggle
on:
   cp '/switch/.packages/Ryazhenkabestcfw Tuner/Data/Updater/exosphere.bin' /atmosphere/exosphere.bin
   set-ini-val-matching-key /bootloader/hekate_ipl.ini cal0blank secmon atmosphere/exosphere.bin
